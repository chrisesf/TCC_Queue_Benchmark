[package]
name = "tcc-bench"
version = "0.1.0"
edition = "2021"
description = "Benchmark comparativo entre filas em memoria e message brokers distribuidos"

[features]
# Clientes dos brokers. Desligados por padrao: exigem os brokers no ar e, no caso do
# Kafka, compilam o librdkafka (rode no container Linux).
rabbitmq = ["dep:lapin", "dep:tokio", "dep:futures-util", "docker-stats"]
kafka = ["dep:rdkafka", "dep:futures-executor", "docker-stats"]
brokers = ["rabbitmq", "kafka"]
# CPU e memoria do container do broker via socket do Docker.
docker-stats = ["dep:serde_json"]

[dependencies]
crossbeam-epoch = "0.9"
crossbeam-utils = "0.8"
lapin = { version = "4.12", optional = true, default-features = false, features = ["tokio"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "time"] }
futures-util = { version = "0.3", optional = true, default-features = false }
rdkafka = { version = "0.39", optional = true, default-features = false, features = ["libz"] }
futures-executor = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }

[[bin]]
name = "rabbitmq_bench"
path = "src/bin/rabbitmq_bench.rs"
required-features = ["rabbitmq"]

[[bin]]
name = "kafka_bench"
path = "src/bin/kafka_bench.rs"
required-features = ["kafka"]

[[test]]
name = "brokers"
path = "tests/brokers.rs"
required-features = ["brokers"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true
