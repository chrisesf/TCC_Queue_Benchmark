services:
  bench:
    build: .
    container_name: tcc-bench
    working_dir: /app
    volumes:
      - .:/app
      - cargo-target:/build
      - cargo-registry:/usr/local/cargo/registry
      # CPU e memoria dos containers dos brokers (API do Docker). Da ao container acesso
      # equivalente a root no host: use apenas em maquina de testes.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CARGO_TARGET_DIR: /build
    stdin_open: true
    tty: true
    command: sleep infinity

  # Brokers: so sobem com `docker compose --profile brokers up -d`, para nao disputar
  # CPU e memoria com os benchmarks das filas em memoria. Sem portas publicadas: o
  # cliente roda no container `bench`, na mesma rede.
  rabbitmq:
    image: rabbitmq:4.3.6-alpine
    container_name: tcc-rabbitmq
    profiles: [brokers]
    hostname: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    container_name: tcc-kafka
    profiles: [brokers]
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Broker unico: topicos internos (offsets e transacoes) sem replicacao.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topicos sao criados/removidos pelo benchmark; sem isso, um cliente com metadados
      # atrasados recriaria um topico ja removido.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms1G -Xmx1G
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 20s
      retries: 20

volumes:
  cargo-target:
  cargo-registry:
